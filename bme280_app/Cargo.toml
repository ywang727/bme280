[package]
name = "bme280_app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "host"
path = "src/host.rs"

[[bin]]
name = "nrf52840"
path = "src/nrf52840.rs"


[dependencies]

# No common dependencies to avoid compilation feature/target conflicts.
[target.'cfg(not(target_arch = "arm"))'.dependencies]
bme280_driver = { path = "../bme280_driver", default-features = false, features = [
    "i2c",
    "async",
] }
embassy-time = { version = "0.5.1", features = ["std", "generic-queue-64"] }
embedded-hal-mock = { version = "0.11", features = [
    "eh1",
    "embedded-hal-async",
] }
futures = "0.3"
[target.'cfg(target_arch = "arm")'.dependencies]
bme280_driver = { path = "../bme280_driver", default-features = false, features = [
    "i2c",
    "async",
    "defmt",
] }
embassy-nrf = { version = "0.10.0", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "time",
] }
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "generic-queue-8",
] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-futures = "0.1.2"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
cortex-m = { version = "0.7.7", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7"
static_cell = "2"
