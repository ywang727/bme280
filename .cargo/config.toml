[env]
DEFMT_LOG = "trace"

[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip nRF52840_xxAA"
rustflags = ["-C", "link-arg=-Tlink.x", "-C", "link-arg=-Tdefmt.x"]

[build]
target = "thumbv7em-none-eabihf"

[alias]
host-run = "run -p bme280_app --bin host --target x86_64-pc-windows-msvc"
host-build = "build -p bme280_app --bin host --target x86_64-pc-windows-msvc"
